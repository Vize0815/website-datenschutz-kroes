name: "Direct SSH Deploy"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ID: dbed54b8-8c64-4693-acd3-add7dd4eb016
      SSH_HOST: access-5020246730.app-ionos.space
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set SSH username secret name
        run: |
          echo "SSH_USERNAME_SECRET=IONOS_DEPLOYMENT_$(echo $DEPLOYMENT_ID | tr '[:lower:]' '[:upper:]' | tr '-' '_')_SSH_USERNAME" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.IONOS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

      - name: Find webroot path
        run: |
          SSH_USER="${{ secrets[env.SSH_USERNAME_SECRET] }}"
          echo "=== Home directory ==="
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "pwd && ls -la ~"
          echo "=== Looking for webroot ==="
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "ls -la ~/html 2>/dev/null || ls -la ~/public_html 2>/dev/null || ls -la ~/www 2>/dev/null || echo 'no standard webroot found'"

      - name: Remove html subfolder to free disk space
        run: |
          SSH_USER="${{ secrets[env.SSH_USERNAME_SECRET] }}"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "rm -rf ~/html && echo 'html folder removed'"

      - name: Remove orphaned files before upload
        # Vor dem Upload, damit rsync genug Platz fuer seine Zwischenkopien hat
        # 27.11.2026: verwaiste Dateien laut Auswertung server-usage.yaml entfernen
        # (alte Seiten mit 301 in .htaccess, alte PHP Formulare, alte Schriften und Bilder)
        run: |
          SSH_USER="${{ secrets[env.SSH_USERNAME_SECRET] }}"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "rm -f ~/PECBWebinar.webp ~/'Alexander Kroes - PECBWebinar.webp' ~/nis2-seminar.html ~/nis2-schulung-deutschland.html ~/dsgvo-seminar.html ~/partnerprogramm/onepager.htm ~/fonts/poppins-400-latin.woff2 ~/fonts/poppins-600-latin.woff2 ~/fonts/poppins-700-latin.woff2 ~/seminar-anfrage.php ~/rueckruf.php ~/alexander-kroes.png && echo 'verwaiste Dateien entfernt'"

      - name: Deploy files directly to webroot
        run: |
          SSH_USER="${{ secrets[env.SSH_USERNAME_SECRET] }}"
          rsync -avz \
            --no-perms --no-owner --no-group \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.gitignore' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ "$SSH_USER@$SSH_HOST:~/"
          # Frueher mitkopierte Werkzeugdatei vom Webspace entfernen
          # 26.11.2026: ungenutzten Quiz Endpoint samt Protokoll entfernen
          # 27.11.2026: altes Deckblatt NIS2 Management Briefing entfernen
          # 27.11.2026: altes Vorschaubild NIS2 Selbstcheck entfernen
          # 27.11.2026: altes Cover Management Briefing und alte Quick Steps entfernen
          # 27.11.2026: altes Vorschaubild Risikoanalyse entfernen
          # 27.11.2026: altes Vorschaubild Praxisleitfaden DSGVO und KI entfernen
          # 27.11.2026: altes Vorschaubild DSGVO Quick Check entfernen
          # 27.11.2026: altes Vorschaubild Datenschutzinformation Bewerber entfernen
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "rm -f ~/.gitignore ~/quiz-lead.php ~/quiz-lead.log ~/NIS2-Leitfaden-Deckblatt.jpg ~/'NIS2-Selbstcheck .jpg' ~/NIS2-Management-Briefing-Datenschutz-Kroes.webp ~/'NIS2-Quick-Steps .jpg' ~/'Quick-Steps NIS2-Richtlinie.pdf' ~/'Risikoanalyse nach NIS2 .png' ~/'Praxis Leitfaden DSGVO und KI .jpg' ~/'Praxis Leitfaden DSGVO Check .jpg' ~/'Mustervorlage Bewerbung .jpg'"
