<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partnerprogramm · Datenschutz Kroes</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0F1F3D;
      --navy-light: #162847;
      --gold: #C9A84C;
      --gold-hover: #d4b668;
      --text: #e2e8f0;
      --text-muted: #8A99AD;
      --border: rgba(201,168,76,0.18);
      --error: #e05555;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .gate {
      width: 100%;
      max-width: 440px;
    }

    .gate__logo {
      text-align: center;
      margin-bottom: 48px;
    }

    .gate__wordmark {
      display: inline-block;
      text-decoration: none;
    }

    .gate__wordmark img {
      height: 120px;
      width: auto;
    }

    .gate__card {
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 36px;
    }

    .gate__eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .gate__heading {
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .gate__sub {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .gate__label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .gate__input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: border-color 200ms ease;
      margin-bottom: 8px;
    }

    .gate__input:focus {
      border-color: var(--gold);
    }

    .gate__input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .gate__error {
      font-size: 13px;
      color: var(--error);
      min-height: 20px;
      margin-bottom: 16px;
      display: none;
    }

    .gate__error.visible {
      display: block;
    }

    .gate__btn {
      width: 100%;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 15px 24px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 200ms ease, transform 100ms ease;
    }

    .gate__btn:hover {
      background: var(--gold-hover);
    }

    .gate__btn:active {
      transform: scale(0.98);
    }

    .gate__hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
      line-height: 1.5;
    }

    .gate__hint a {
      color: var(--gold);
      text-decoration: none;
    }

    .gate__hint a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .gate__card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="gate">
    <div class="gate__logo">
      <a href="../" class="gate__wordmark">
        <img src="../Datenschutz Kroes Logo Klein.png" alt="Datenschutz Kroes">
      </a>
    </div>

    <div class="gate__card">
      <p class="gate__eyebrow">Exklusiver Bereich</p>
      <h1 class="gate__heading">Partnerprogramm</h1>
      <p class="gate__sub">Dieser Bereich ist nur für Partnerunternehmen zugänglich. Bitte geben Sie Ihr Zugangskennwort ein.</p>

      <label for="pw" class="gate__label">Zugangskennwort</label>
      <input
        type="password"
        id="pw"
        class="gate__input"
        placeholder="••••••••••••"
        autocomplete="current-password"
      >
      <div class="gate__error" id="errMsg">Falsches Kennwort. Bitte erneut versuchen.</div>

      <button class="gate__btn" id="enterBtn" type="button">Zugang freischalten</button>
    </div>

    <p class="gate__hint">
      Sie haben noch kein Zugannskennwort?<br>
      <a href="mailto:office@datenschutz-kroes.at">Kontakt aufnehmen</a>
    </p>
  </div>

  <script>
    (function() {
      var PW = 'DSB@DS-Kroes_26';
      var KEY = 'pp_auth_v1';

      function go() {
        try { sessionStorage.setItem(KEY, '1'); } catch(e) {}
        window.location.href = 'onepager.htm';
      }

      if (sessionStorage.getItem(KEY) === '1') {
        go();
        return;
      }

      var input = document.getElementById('pw');
      var btn = document.getElementById('enterBtn');
      var err = document.getElementById('errMsg');

      function attempt() {
        if (input.value === PW) {
          err.classList.remove('visible');
          go();
        } else {
          err.classList.add('visible');
          input.value = '';
          input.focus();
        }
      }

      btn.addEventListener('click', attempt);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') attempt();
      });
    })();
  </script>
</body>
</html>
