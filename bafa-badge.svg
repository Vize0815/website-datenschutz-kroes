<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 78" role="img" aria-label="BAFA - Staatlich subventionierte Unternehmensberatung - Registriertes Beratungsunternehmen">
  <defs>
    <clipPath id="bafa-card">
      <rect width="260" height="78" rx="4"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bafa-card)">
    <rect width="260" height="78" fill="#ffffff"/>
    <!-- BAFA colored letters -->
    <text y="50" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif" font-weight="900" font-size="40">
      <tspan x="8" fill="#E41E20">B</tspan>
      <tspan fill="#1B3F8A">A</tspan>
      <tspan fill="#F08010">F</tspan>
      <tspan fill="#7A2090">A</tspan>
    </text>
    <!-- German flag vertical bars (black, red, gold) -->
    <rect x="107" y="8" width="5" height="42" fill="#1A1A1A"/>
    <rect x="115" y="8" width="5" height="42" fill="#CC0000"/>
    <rect x="123" y="8" width="5" height="42" fill="#FFCC00"/>
    <!-- Right-side text stack -->
    <text x="135" y="22" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#111111">STAATLICH</text>
    <text x="135" y="34" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#111111">SUBVENTIONIERTE</text>
    <text x="135" y="46" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#111111">UNTERNEHMENSBERATUNG</text>
    <!-- Bottom navy bar -->
    <rect x="0" y="54" width="260" height="24" fill="#0F1F5C"/>
    <text x="130" y="69" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#ffffff" letter-spacing="0.7">REGISTRIERTES BERATUNGSUNTERNEHMEN</text>
  </g>
</svg>
